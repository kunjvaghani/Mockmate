services:
  mockmate:
    build:
      context: .
      dockerfile: Dockerfile
    image: mockmate:latest
    container_name: mockmate-app
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
